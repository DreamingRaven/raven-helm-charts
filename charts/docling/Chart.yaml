apiVersion: v2
appVersion: v1.37.0 # renovate: datasource=docker depName=ghcr.io/docling-project/docling-serve
description: Document parsing server for gen AI applications
name: docling
type: application
version: 0.1.0
dependencies:
- alias: docling
  name: corvid-app
  version: 0.17.0
  repository: "oci://registry.gitlab.com/georgeraven/raven-helm-charts"
  condition: docling.enabled
- alias: docling-worker
  name: corvid-app
  version: 0.17.0
  repository: "oci://registry.gitlab.com/georgeraven/raven-helm-charts"
  condition: docling-worker.enabled
- alias: valkey
  name: corvid-app
  version: 0.17.0
  repository: "oci://registry.gitlab.com/georgeraven/raven-helm-charts"
  condition: valkey.enabled
